<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - Bayaw</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="modal-overlay" id="customModal">
        <div class="modal-box"><h3 id="modalTitle">Title</h3><p id="modalMessage">Message</p><div class="modal-actions"><button class="btn-outline" id="modalBtnNo" onclick="closeModal()">No</button><button class="btn-primary" id="modalBtnYes">Yes</button></div></div>
    </div>

    <div class="mobile-header">
        <img src="images/logo.png" style="height: 35px;" alt="Logo">
        <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="logo"><img src="images/logo.png" alt="Bayaw Motorshop"></div>
            <ul class="nav-menu">
                <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="motor-parts.html"><i class="fa-solid fa-gear"></i> Motor Parts</a></li>
                <li><a href="cart.html" class="active"><i class="fa-solid fa-cart-shopping"></i> My Cart <span class="cart-badge" id="cartCount">0</span></a></li>
                <li><a href="orders.html"><i class="fa-solid fa-box"></i> My Orders</a></li>
                <li><a href="book-appointment.html"><i class="fa-regular fa-calendar-check"></i> Book Appointment</a></li>
                <li><a href="mechanics.html"><i class="fa-solid fa-wrench"></i> Mechanics</a></li>
                <li><a href="inventory.html"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a></li>
                <li><a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact Us</a></li>
            </ul>
            <div class="user-section">
                <div class="user-profile"><div class="avatar"><i class="fa-solid fa-user"></i></div><div><h4></h4><p>Customer</p></div></div>
                <button class="logout-btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header"><h1>Shopping Cart</h1><p>Review your items and proceed to checkout</p></div>
            <div class="cart-container" id="cartContainer"></div>
        </main>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="motor-parts.html"><i class="fa-solid fa-gear"></i><span>Shop</span></a>
        <a href="cart.html" class="active"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a>
        <a href="orders.html"><i class="fa-solid fa-box"></i><span>Orders</span></a>
        <a href="book-appointment.html"><i class="fa-regular fa-calendar-check"></i><span>Book</span></a>
        <a href="mechanics.html"><i class="fa-solid fa-wrench"></i><span>Mech</span></a>
        <a href="inventory.html"><i class="fa-solid fa-boxes-stacked"></i><span>Inv</span></a>
        <a href="contact.html"><i class="fa-solid fa-envelope"></i><span>Contact</span></a>
    </nav>

    <script>
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
        function getCart() { return JSON.parse(localStorage.getItem('bayawCart')) || []; }
        function saveCart(cart) { localStorage.setItem('bayawCart', JSON.stringify(cart)); updateCartBadge(); }
        function updateCartBadge() { const totalQty = getCart().reduce((sum, item) => sum + item.qty, 0); document.querySelectorAll('.cart-badge').forEach(b => b.innerText = totalQty); }
        
        function showModal(title, message, onConfirm, yesText = "Yes", noText = "No") {
            document.getElementById('modalTitle').innerText = title; document.getElementById('modalMessage').innerText = message;
            const btnYes = document.getElementById('modalBtnYes'); const btnNo = document.getElementById('modalBtnNo'); btnYes.innerText = yesText; btnNo.innerText = noText;
            const newYes = btnYes.cloneNode(true); const newNo = btnNo.cloneNode(true); btnYes.parentNode.replaceChild(newYes, btnYes); btnNo.parentNode.replaceChild(newNo, btnNo);
            newYes.onclick = () => { closeModal(); if(onConfirm) onConfirm(); }; newNo.onclick = () => { closeModal(); };
            document.getElementById('customModal').classList.add('active');
        }
        function closeModal() { document.getElementById('customModal').classList.remove('active'); }

        function renderCart() {
            const cart = getCart(); const container = document.getElementById('cartContainer');
            if (cart.length === 0) { container.innerHTML = `<div class="empty-cart"><i class="fa-solid fa-cart-shopping"></i><h2>Your cart is empty</h2><p style="margin-top: 10px; margin-bottom: 20px;">Looks like you haven't added anything yet.</p><button class="btn-primary" onclick="window.location.href='motor-parts.html'" style="max-width: 250px; margin: 0 auto; padding: 15px;">Start Shopping</button></div>`; return; }
            
            let html = ''; let total = 0;
            cart.forEach(item => {
                let itemTotal = item.price * item.qty; total += itemTotal;
                html += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="cart-details"><h4>${item.name}</h4><div class="price">₱${item.price.toLocaleString()}</div></div>
                        <div class="cart-actions">
                            <!-- PLUS AND MINUS BUTTONS -->
                            <div class="qty-container">
                                <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
                                <input type="text" class="qty-input" value="${item.qty}" readonly>
                                <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                            </div>
                            <button class="btn-remove" onclick="confirmRemove('${item.id}', '${item.name}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
            });
            html += `<div class="cart-summary"><h3>Total: <span class="total-price">₱${total.toLocaleString()}</span></h3><button class="btn-primary" style="max-width: 300px; margin-left: auto; padding: 15px;" onclick="confirmCheckout(${total})">Proceed to Checkout</button></div>`;
            container.innerHTML = html;
        }

        // Logic para sa Plus at Minus
        function changeQty(id, change) {
            let cart = getCart();
            let item = cart.find(i => i.id === id);
            if (item) {
                item.qty += change;
                if (item.qty < 1) item.qty = 1; // Bawal bumaba sa 1
                saveCart(cart); 
                renderCart();
            }
        }

        function confirmRemove(id, name) {
            showModal("Remove Item", `Are you sure you want to remove ${name}?`, () => {
                let cart = getCart().filter(item => item.id !== id); saveCart(cart); renderCart();
            }, "Yes, Remove", "Cancel");
        }

        function confirmCheckout(totalAmount) {
            showModal("Checkout", "Are you sure you want to place this order?", () => {
                const cart = getCart();
                let orders = JSON.parse(localStorage.getItem('bayawOrders')) || [];
                orders.push({ orderId: 'ORD-' + Math.floor(Math.random() * 1000000), date: new Date().toLocaleString(), items: cart, total: totalAmount, status: 'Processing' });
                localStorage.setItem('bayawOrders', JSON.stringify(orders));
                localStorage.removeItem('bayawCart'); updateCartBadge();
                
                showModal("Order Successful!", "Thank you! Your order is being processed.", () => {
                    window.location.href = 'orders.html';
                }, "View My Orders", "Close");
            }, "Yes, Place Order", "Cancel");
        }

        function confirmLogout() { showModal("Logout", "Are you sure you want to log out?", () => { window.location.href = 'welcome.html'; }, "Yes, Logout", "Cancel"); }

        updateCartBadge(); renderCart();
    </script>
</body>
</html>
