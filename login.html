<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bayaw Motorshop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="logo"><img src="images/logo.png" alt="Bayaw Motorshop"></div>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('loginPassword', this)"></i>
                </div>
            </div>
            <div class="form-options">
                <label><input type="checkbox"> Remember me</label>
                <a href="javascript:void(0)" onclick="alert('Reset password link sent!')">Forgot password?</a>
            </div>
            <button type="submit" class="btn-primary">LOGIN</button>
        </form>
        
        <!-- ITO YUNG LINK -->
        <div class="login-links">Don't have an account? <a href="signup.html">Sign Up</a></div>
    </div>

    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") { input.type = "text"; icon.classList.replace("fa-eye", "fa-eye-slash"); } 
            else { input.type = "password"; icon.classList.replace("fa-eye-slash", "fa-eye"); }
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) { 
            e.preventDefault(); 
            window.location.href = 'dashboard.html'; 
        });
    </script>
</body>
</html>
